[SIMULATION]
# -----------------------------------------------------------------
# 1. SIMULATION MODE
#    - "super_fast" : Pure Python HTTP API requests (No browser window). 
#                     Runs 100+ transactions in seconds! (Recommended for large testing)
#    - "fast"       : Visible Chromium browser window with fast-forward clicks.
#    - "normal"     : Visible Chromium browser window with visual human-like delays.
# -----------------------------------------------------------------
simulation_mode = fast

# -----------------------------------------------------------------
# 2. TRANSACTION COUNT
#    - Supported Range: 10 to 2000
#    - Set to 10 for quick 5-second sanity testing.
#    - Set to 55 for standard demo dataset.
#    - Set to 500+ for large bulk reconciliation testing.
# -----------------------------------------------------------------
razorpay_transactions_count = 55

# -----------------------------------------------------------------
# 3. DATE RANGE (Format: YYYY-MM-DD)
#    - Defines the start and end dates for orders and bank statements.
# -----------------------------------------------------------------
start_date = 2026-09-01
end_date = 2026-09-27

# -----------------------------------------------------------------
# 4. IMPUTED BANK EXPENSES PERCENTAGE (%)
#    - Percentage of non-Razorpay bank transactions (UPI, Zomato, Rent, etc.)
#    - Formula: Non-Razorpay Transactions = (Razor Pay Transactions Count) * (Percentage / 100)
#    - Example: 55 orders @ 25% = 14 expense debits added to bank statement.
# -----------------------------------------------------------------
imputed_expenses_percentage = 25

# -----------------------------------------------------------------
# 5. BANK STATEMENT PDF FORMAT & OPENING BALANCE
#    - "UNION_BANK" : Union Bank of India format (7-column layout with summary box)
#    - "SBI"        : State Bank of India format (8-column landscape layout)
# -----------------------------------------------------------------
bank_pdf_format = UNION_BANK
opening_balance = 10000.00

[RANGE_LIMITS]
min_transactions = 10
max_transactions = 2000
