# =====================================================================
# AutoReconAI - Dynamic AI Model Configuration & Resilient Fallback Chain
# =====================================================================
# Users & Reviewers can customize or update model names here without touching Python code.
# The system automatically tries models in the fallback chain sequentially if any model is rate-limited or deprecated.

[GEMINI_MODELS]
# Primary Model (Recommended: High reasoning, free-tier supported, 1M+ token context)
primary_model = gemini-3.6-flash

# High-Reasoning Model (Deep auditing & complex tax compliance analysis)
reasoning_model = gemini-2.5-pro

# Fallback Chain (Tried sequentially if primary model returns 404/429/500 errors)
fallback_model_1 = gemini-1.5-flash
fallback_model_2 = gemini-1.5-pro
fallback_model_3 = gemini-2.0-flash
fallback_model_4 = gemini-pro

[MODEL_SETTINGS]
# Temperature for financial precision (0.0 = deterministic rule compliance & exact math)
temperature = 0.0

# Max output token limit per synthesis turn
max_output_tokens = 2048
