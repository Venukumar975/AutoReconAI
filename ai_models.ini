# =====================================================================
# AutoReconAI - Dynamic AI Model Configuration & Resilient Fallback Chain
# =====================================================================
# Users & Reviewers can customize or update model names here without touching Python code.
# The system automatically tries models in the fallback chain sequentially if any model is rate-limited (429) or deprecated (404).

[GEMINI_MODELS]
# Current Active Model (Fast execution, 15 RPM bucket, 500 Requests/Day, Native Function Calling)
current_model = gemini-3.5-flash-lite

# Fallback 1: High-Speed Model (Independent 15 RPM bucket, 500 Requests/Day)
fallback_model_1 = gemini-3.1-flash-lite

# Fallback 2: Auto-Updated Stable Flash Model (Flagship Production Flash)
fallback_model_2 = gemini-flash-latest

# Fallback 3: Deep Domain Reasoning Model (High precision financial synthesis, 5 RPM bucket)
fallback_model_3 = gemini-3.5-flash

# Fallback 4: Next-Gen Reasoning Model (Advanced multi-step auditing, 5 RPM bucket)
fallback_model_4 = gemini-3.7-flash

# Fallback 5: Extended Fast Flash Model (5 RPM bucket)
fallback_model_5 = gemini-3.6-flash

[MODEL_SETTINGS]
# Temperature for financial precision (0.0 = deterministic rule compliance & exact math)
temperature = 0.0

# Max output token limit per synthesis turn
max_output_tokens = 2048
