#-----------------------------This Config File controls our Data Simulation Settings------------------------------#
#-----------------------------------------------------------------------------------------------------------------#
[SIMULATION]
# -----------------------------------------------------------------
# 1. SIMULATION MODE
#    - "super_fast" : Pure Python HTTP API requests (No browser window)                 [Recommended Mode,no installation needed]. 
#                     Runs 100+ transactions in seconds! (Recommended for large testing)
#    - "fast"       : Visible Chromium browser window with fast-forward clicks.         [Need to install playwright & chromium]
#    - "normal"     : Visible Chromium browser window with visual human-like delays.    [Need to install playwright & chromium]
# -----------------------------------------------------------------
simulation_mode = super_fast

# -----------------------------------------------------------------
# 2. TRANSACTION COUNT : Simulates Customer Orders / Transactions ( Buying items via razorpay in our Merchant Store )
#    - Supported Range: 10 to 2000
#    - Set to 10 for quick 5-second sanity testing.
#    - Set to 55 for standard demo dataset.
#    - Set to 500+ for large bulk reconciliation testing.
# -----------------------------------------------------------------
razorpay_transactions_count = 50

# -----------------------------------------------------------------
# 3. DATE RANGE (Format: YYYY-MM-DD)
#    - Defines the start and end dates for orders and bank statements.
#    - All Razorpay & Non-razorpay ( other expenses ) fall in this date range in Bank Statement
# -----------------------------------------------------------------
start_date = 2026-05-01
end_date = 2026-05-30

# -----------------------------------------------------------------
# 4. IMPUTED BANK EXPENSES PERCENTAGE (%)
#    - Percentage of non-Razorpay bank transactions (UPI, Zomato, Rent, etc.)
#    - Formula: Non-Razorpay Transactions = (Razor Pay Transactions Count) * (Percentage / 100)
#    - Example: 55 orders @ 25% = 14 expense debits added to bank statement.
# -----------------------------------------------------------------
imputed_expenses_percentage = 30

# -----------------------------------------------------------------
# 5. BANK STATEMENT PDF FORMAT & OPENING BALANCE
#    - "UNION_BANK" : Union Bank of India format (7-column layout with summary box)
#    - "SBI"        : State Bank of India format (8-column landscape layout)
# -----------------------------------------------------------------
bank_pdf_format = UNION_BANK
opening_balance = 25000.00

[CONTRACTED_RATES]
# Agreed/Contracted Merchant SLA Rates
mdr_rate_percent = 2.0
gst_rate_percent = 18.0

[MERCHANT_TAX_PROFILE]
# Statutory Merchant Tax Credentials & Section 194-O TDS Policy
gstin = 36AATUF1234F1ZV
pan = ABCDE1234F

# is_tds_applicable & tds deduction from GMV, takes effect only when enable_edge_cases is set to true
is_tds_applicable = yes
tds_rate_percent = 1

[EDGE_CASES]
# -----------------------------------------------------------------
# Master toggle: 
#   - true  : Injects realistic commercial anomalies into random transactions.
#   - false : Generates 100% cleanly matched data (ideal for baseline sanity checks).
# -----------------------------------------------------------------
enable_edge_cases = true

# Edge Case 1: Count of captured orders left as PENDING in store_orders.csv (Simulates dropped webhook notifications)
dropped_webhook_count = 4

# Edge Case 2: Count of payments billed above the agreed 2.0% MDR SLA (Simulates dynamic overcharges adding +0.50% to +0.85% extra fee)
fee_overcharge_count = 3

# Edge Case 3: Count of prior-billing-cycle customer return deductions injected into the settlement (Simulates orphan refunds with un-reversed fees)
orphan_refund_count = 3

# Edge Case 4: Count of customer bank disputes placed on hold (Simulates gross GMV frozen in escrow plus ₹500 dispute fee + 18% GST)
chargeback_hold_count = 4


[RANGE_LIMITS]
# -----------------------------------------------------------------
# Advisory / Recommended boundary settings for simulation performance.
# You are free to set razorpay_transactions_count to any number as per your wish,
# -----------------------------------------------------------------
min_transactions = 10
max_transactions = 2000

